[project]
name = "saveatrain-mcp"
version = "0.1.0"
description = "MCP server wrapping the Save a Train vendor API"
readme = "README.md"
authors = [
    { name = "Paviel", email = "qwp.kpv@gmail.com" }
]
requires-python = ">=3.12.2"
dependencies = [
    "fastmcp>=3.0,<4",
    "httpx>=0.27,<1",
    "motor>=3.5,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
]

[project.scripts]
saveatrain-mcp = "saveatrain_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.9.26,<1"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
